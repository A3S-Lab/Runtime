<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">A3S Runtime</title>
  <desc id="desc">A provider-neutral Rust runtime contract showing an immutable unit generation moving through specification, durable receipt, provider driver, and observed state.</desc>

  <rect width="1200" height="420" rx="28" fill="#0b0d10"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#2c323a" stroke-width="2"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <circle cx="68" cy="57" r="7" fill="#f97316"/>
    <text x="88" y="64" fill="#a9b1bb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="600" letter-spacing="2">A3S SYSTEMS / EXECUTION CONTRACT</text>

    <text x="62" y="144" fill="#f7f3ea" font-size="68" font-weight="750" letter-spacing="-2">
      <tspan fill="#f97316">A3S</tspan><tspan> Runtime</tspan>
    </text>
    <text x="64" y="196" fill="#f7f3ea" font-size="27" font-weight="600">
      One durable lifecycle for Tasks and Services.
    </text>
    <text x="64" y="232" fill="#a9b1bb" font-size="21">
      Validate once. Dispatch explicitly. Replay the same result.
    </text>

    <g id="metadata" transform="translate(64 314)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="650">
      <rect width="126" height="42" rx="21" fill="#171b20" stroke="#343b44"/>
      <text x="22" y="27" fill="#f7f3ea">RUST 1.85+</text>

      <rect x="140" width="174" height="42" rx="21" fill="#171b20" stroke="#343b44"/>
      <text x="162" y="27" fill="#f7f3ea">SCHEMA VERSIONED</text>

      <rect x="328" width="182" height="42" rx="21" fill="#171b20" stroke="#343b44"/>
      <text x="350" y="27" fill="#f7f3ea">PROVIDER NEUTRAL</text>
    </g>
  </g>

  <g id="generation-proof" transform="translate(674 42)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="468" height="336" rx="22" fill="#12161b" stroke="#343b44" stroke-width="1.5"/>
    <text x="30" y="39" fill="#a9b1bb"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="650" letter-spacing="1.5">IMMUTABLE GENERATION</text>

    <g id="identity" transform="translate(30 62)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <rect width="170" height="48" rx="9" fill="#0b0d10" stroke="#343b44"/>
      <text x="16" y="30" fill="#f7f3ea">unit/agent-42</text>

      <rect x="182" width="94" height="48" rx="9" fill="#0b0d10" stroke="#f97316"/>
      <text x="199" y="30" fill="#f97316" font-weight="700">gen 07</text>

      <rect x="288" width="120" height="48" rx="9" fill="#0b0d10" stroke="#343b44"/>
      <text x="304" y="30" fill="#f7f3ea">sha256:9f…</text>
    </g>

    <g id="lifecycle-track" transform="translate(30 154)">
      <path d="M24 24 H382" fill="none" stroke="#434b55" stroke-width="3"/>
      <path d="M24 24 H382" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="76 282"/>

      <circle cx="24" cy="24" r="12" fill="#f97316"/>
      <circle cx="143" cy="24" r="12" fill="#12161b" stroke="#f97316" stroke-width="4"/>
      <circle cx="262" cy="24" r="12" fill="#12161b" stroke="#77808b" stroke-width="4"/>
      <circle cx="382" cy="24" r="12" fill="#5eead4"/>

      <g fill="#f7f3ea" font-size="18" font-weight="650" text-anchor="middle">
        <text x="24" y="64">SPEC</text>
        <text x="143" y="64">RECEIPT</text>
        <text x="262" y="64">DRIVER</text>
        <text x="382" y="64">OBSERVED</text>
      </g>
    </g>

    <g id="replay-proof" transform="translate(30 248)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="408" height="62" rx="11" fill="#0b0d10" stroke="#343b44"/>
      <text x="18" y="27" fill="#a9b1bb" font-size="16">request / 7f3a…</text>
      <text x="18" y="49" fill="#f7f3ea" font-size="18" font-weight="650">exact retry → same result</text>
      <rect x="289" y="15" width="101" height="32" rx="16" fill="#153d36"/>
      <text x="339.5" y="36" fill="#5eead4" font-size="15" font-weight="750" text-anchor="middle">COMPLETED</text>
    </g>
  </g>
</svg>
